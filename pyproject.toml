[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "european-demand-intelligence"
version = "0.1.0"
description = "Provenance-first European B2B demand intelligence harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyarrow>=19,<22",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
demand-harness = "demand_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["demand_intelligence"]

